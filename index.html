<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이력서 빌더</title>
<meta name="theme-color" content="#1a1a1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --paper-w: 210mm;
  --ink: #111;
  --rule: #b9b9b9;
  --rule-strong: #111;
  --ui-bg: #f4f4f5;
  --ui-panel: #fff;
  --ui-line: #e3e3e6;
  --ui-text: #1c1c1e;
  --ui-mut: #6f6f76;
  --ui-accent: #2f6df6;
  --font-ko: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
             "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR",
             "Malgun Gothic", "맑은 고딕", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-ko);
  font-size:15px;
  line-height:1.55;
  color:var(--ui-text);
  background:var(--ui-bg);
  word-break:keep-all;
  overflow-wrap:break-word;
  line-break:strict;
  -webkit-text-size-adjust:100%;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}

/* ───────── 상단 바 ───────── */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 16px;
  background:var(--ui-panel);
  border-bottom:1px solid var(--ui-line);
}
.brand{font-weight:700;font-size:15px;letter-spacing:.02em;margin-right:4px}
.spacer{flex:1}
.btn{
  border:1px solid var(--ui-line);
  background:var(--ui-panel);
  border-radius:8px;
  padding:7px 12px;
  font-size:13.5px;
  cursor:pointer;
  white-space:nowrap;
}
.btn:hover{background:#f0f0f2}
.btn.primary{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ui-mut)}
.save-state{font-size:12.5px;color:var(--ui-mut);min-width:5.5em}

/* 카테고리 고르기 메뉴 */
.menu-wrap{position:relative;display:inline-flex}
.preset-menu{
  position:absolute;top:calc(100% + 8px);left:0;z-index:40;
  width:min(420px, calc(100vw - 32px));
  padding:8px;
  background:var(--ui-panel);
  border:1px solid var(--ui-line);
  border-radius:12px;
  box-shadow:0 12px 32px rgba(0,0,0,.18);
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
}
.preset-menu[hidden]{display:none}
.preset-menu .menu-cap{
  grid-column:1 / -1;font-size:12px;color:var(--ui-mut);padding:2px 4px 4px;
}
.preset-item{
  border:1px solid var(--ui-line);background:#fff;border-radius:8px;
  padding:8px 10px;font-size:13.5px;text-align:left;cursor:pointer;line-height:1.35;
}
.preset-item:hover{border-color:var(--ui-accent);color:var(--ui-accent)}
.preset-item small{display:block;font-size:11.5px;color:var(--ui-mut);margin-top:2px}
.preset-item:hover small{color:var(--ui-accent);opacity:.75}
.preset-item.blank{grid-column:1 / -1;border-style:dashed}

/* ───────── 레이아웃 ───────── */
.app{
  display:grid;
  grid-template-columns: minmax(360px, 44%) 1fr;
  gap:0;
  height:calc(100dvh - 53px);
}
.pane{overflow-y:auto;overflow-x:hidden}
.editor{
  padding:16px 16px 120px;
  border-right:1px solid var(--ui-line);
  background:var(--ui-bg);
}
.viewer{
  background:#6b6b70;
  padding:24px 16px 80px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ───────── 에디터 ───────── */
.card{
  background:var(--ui-panel);
  border:1px solid var(--ui-line);
  border-radius:12px;
  margin-bottom:12px;
  overflow:hidden;
}
.card-head{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;
  background:#fafafb;
  border-bottom:1px solid var(--ui-line);
}
.card-head.collapsed{border-bottom:none}
.disclose{
  border:none;background:none;cursor:pointer;
  width:22px;height:22px;flex:none;color:var(--ui-mut);
  display:grid;place-items:center;font-size:11px;
}
.sec-title{
  font-weight:600;font-size:14px;
  border:1px solid transparent;border-radius:6px;
  padding:3px 6px;background:transparent;flex:1;min-width:0;
}
.sec-title:hover{border-color:var(--ui-line)}
.sec-title:focus{border-color:var(--ui-accent);outline:none;background:#fff}
.card-body{padding:12px}

.entry{
  border:1px solid var(--ui-line);
  border-radius:10px;
  padding:10px;
  margin-bottom:10px;
  background:#fcfcfd;
}
.entry-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.period{
  flex:1;min-width:0;
  border:1px solid var(--ui-line);border-radius:6px;
  padding:5px 8px;font-size:13px;background:#fff;
}
.period::placeholder{color:#a9a9b0}

.row-item{
  display:grid;
  grid-template-columns: 88px 1fr auto;
  gap:6px;
  align-items:start;
  margin-bottom:6px;
}
.row-item .r-label,
.row-item .r-text{
  border:1px solid var(--ui-line);border-radius:6px;
  padding:6px 8px;font-size:13.5px;background:#fff;width:100%;
}
.row-item .r-text{resize:vertical;min-height:34px;line-height:1.5;overflow:hidden}
.row-item.is-block .r-text{font-size:12.5px;color:#333}
.row-item.is-bold .r-text{font-weight:600}
.row-ops{display:flex;gap:2px;align-items:center}
.iconbtn{
  border:1px solid var(--ui-line);background:#fff;border-radius:6px;
  width:26px;height:30px;display:grid;place-items:center;
  cursor:pointer;font-size:12px;color:var(--ui-mut);padding:0;flex:none;
}
.iconbtn:hover{background:#f1f1f4;color:var(--ui-text)}
.iconbtn.danger:hover{background:#fee;border-color:#f3b8b8;color:#c22}
.iconbtn.on{background:#e0563f;border-color:#e0563f;color:#fff}
.style-sel{
  border:1px solid var(--ui-line);border-radius:6px;
  height:30px;padding:0 4px;font-size:12px;background:#fff;color:var(--ui-mut);
}
.add-row{
  border:1px dashed var(--ui-line);background:#fff;color:var(--ui-mut);
  border-radius:6px;padding:5px 10px;font-size:12.5px;cursor:pointer;
}
.add-row:hover{border-color:var(--ui-accent);color:var(--ui-accent)}
.add-entry{
  width:100%;
  border:1px dashed #c9c9cf;background:#fff;color:var(--ui-mut);
  border-radius:8px;padding:9px;font-size:13px;cursor:pointer;
}
.add-entry:hover{border-color:var(--ui-accent);color:var(--ui-accent)}
.hint{font-size:12px;color:var(--ui-mut);margin:0 0 10px;line-height:1.6}
.head-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.head-fields label{display:block;font-size:12px;color:var(--ui-mut);margin-bottom:3px}
.head-fields input{
  width:100%;border:1px solid var(--ui-line);border-radius:6px;
  padding:7px 9px;font-size:14px;background:#fff;
}

/* ───────── 미리보기(A4) ───────── */
.paper-scaler{transform-origin:top center}
.paper{
  position:relative;
  width:var(--paper-w);
  min-height:297mm;
  background:#fff;
  color:var(--ink);
  padding:19mm 13mm 16mm 14mm;
  box-shadow:0 6px 24px rgba(0,0,0,.28);
  font-size:9pt;
  line-height:1.5;
}
/* 화면 전용 페이지 경계 표시 */
.page-guides{position:absolute;inset:0;pointer-events:none;z-index:2}
.page-guide{position:absolute;left:0;right:0;border-top:.8pt dashed #e0563f}
.page-guide span{
  position:absolute;right:2mm;top:1mm;
  font-size:7pt;color:#e0563f;background:#fff;padding:0 1.5mm;letter-spacing:.02em;
}
.doc-title{
  font-size:27pt;font-weight:600;color:#cdcdcd;
  letter-spacing:.14em;line-height:1.1;margin:6mm 0 0;
}
.doc-name{
  font-size:23pt;font-weight:800;color:#111;
  letter-spacing:.16em;line-height:1.15;margin:1mm 0 13mm;
}
.sec{margin-bottom:6mm}
.sec-head,.sec-ent{
  display:grid;
  grid-template-columns:42mm 1fr;
  column-gap:4mm;
}
/* 섹션 제목이 페이지 끝에 혼자 남지 않게 */
.sec-head{break-after:avoid;page-break-after:avoid}
/* 항목은 한 덩어리로 유지하되, 한 페이지보다 큰 항목(.tall)은 쪼개지도록 허용 */
.sec-ent{break-inside:avoid;page-break-inside:avoid}
.sec-ent.tall{break-inside:auto;page-break-inside:auto}
.sec-ent.forced{break-before:page;page-break-before:always}
.sec-h-l,.sec-h-r{border-top:1.4pt solid var(--rule-strong);padding-top:1.6mm}
.sec-h-l{font-size:9.5pt;font-weight:700;letter-spacing:.01em}
.sec-h-r{min-height:1px}
.ent-l{padding-top:3.2mm;font-size:9pt;color:#111}
.ent-r{padding-top:0}
.sec-ent.gap .ent-l,.sec-ent.gap .ent-r{padding-top:4.5mm}
.sec-ent.forced .ent-l,.sec-ent.forced .ent-r{padding-top:0}
@media screen{
  .sec-ent.forced{position:relative}
  .sec-ent.forced::before{
    content:"";position:absolute;left:0;right:0;top:-2mm;
    border-top:.8pt dashed #e0563f;
  }
}
.prow{
  display:grid;
  grid-template-columns:26mm 1fr;
  column-gap:2mm;
  padding:1.5mm 0 1.5mm;
  border-bottom:.6pt solid var(--rule);
}
.prow.nolabel{grid-template-columns:1fr}
.prow.norule{border-bottom:none;padding-bottom:0}
.prow{break-inside:avoid;page-break-inside:avoid}
.prow.tall{break-inside:auto;page-break-inside:auto;orphans:3;widows:3}
.p-text{orphans:2;widows:2}
.prow.block{padding-top:1.2mm}
.p-label{font-size:9pt;color:#111;white-space:nowrap}
.p-text{font-size:9pt;white-space:pre-wrap}
.prow.bold .p-text{font-weight:700}
.prow.block .p-text{font-size:8.4pt;line-height:1.62;color:#1a1a1a}
.p-text a,.p-text u{text-decoration:underline;color:inherit}
.p-text .bul{display:block;padding-left:4.5mm;text-indent:-2.6mm}
.paper .foot-rule{border-top:1.4pt solid var(--rule-strong);margin-top:2mm}

/* ───────── 모바일 ───────── */
.tabs{display:none;gap:6px}
@media (max-width: 900px){
  .app{grid-template-columns:1fr;height:calc(100dvh - 100px)}
  .editor{border-right:none}
  .tabs{display:flex;width:100%;order:9}
  .tab{flex:1;border:1px solid var(--ui-line);background:#fff;border-radius:8px;padding:8px;cursor:pointer;font-size:13.5px}
  .tab.on{background:var(--ui-text);color:#fff;border-color:var(--ui-text)}
  body.show-editor .viewer{display:none}
  body.show-viewer .editor{display:none}
  .topbar .label-full{display:none}
  /* 툴바가 줄바꿈되면 버튼 위치가 제각각이라, 메뉴는 화면 아래 고정 시트로 띄운다 */
  .preset-menu{
    position:fixed;top:auto;left:12px;right:12px;bottom:12px;
    width:auto;max-height:70vh;overflow-y:auto;
  }
}

/* ───────── 인쇄 ───────── */
/* 여백은 .paper의 padding이 아니라 @page가 잡는다.
   padding으로 잡으면 2페이지부터 위쪽 여백이 사라진다. */
@page{size:A4;margin:19mm 13mm 16mm 14mm}
@media print{
  html,body{background:#fff;margin:0;padding:0}
  .topbar,.editor,.tabs,.page-guides{display:none !important}
  .app{display:block;height:auto;overflow:visible}
  .pane{overflow:visible}
  /* 모바일 탭 규칙(.show-editor .viewer{display:none})보다 우선해야 한다.
     안 그러면 편집 탭 상태로 인쇄할 때 백지가 나온다. */
  body .viewer{background:#fff;padding:0;display:block !important}
  .paper-scaler{transform:none !important;width:auto !important;height:auto !important}
  .paper{box-shadow:none;margin:0;width:auto;min-height:0;padding:0}
  .doc-title{margin-top:0}
  .sec{break-inside:auto}
  /* 마지막 항목이 페이지 첫 줄에 혼자 넘어가지 않게 */
  .sec-head + .sec-ent{break-before:avoid;page-break-before:avoid}
}
</style>
</head>
<body class="show-editor">

<div class="topbar">
  <span class="brand">이력서 빌더</span>
  <span class="save-state" id="saveState">준비됨</span>
  <span class="spacer"></span>
  <span class="menu-wrap">
    <button class="btn" id="btnAddSection">+ <span class="label-full">카테고리</span></button>
    <div class="preset-menu" id="presetMenu" hidden></div>
  </span>
  <button class="btn" id="btnExport">JSON 저장</button>
  <button class="btn" id="btnImport">불러오기</button>
  <button class="btn ghost" id="btnReset">초기화</button>
  <button class="btn primary" id="btnPrint">PDF로 저장</button>
  <input type="file" id="fileInput" accept="application/json" hidden>
  <div class="tabs">
    <button class="tab on" data-view="editor">편집</button>
    <button class="tab" data-view="viewer">미리보기</button>
  </div>
</div>

<div class="app">
  <div class="pane editor" id="editor"></div>
  <div class="pane viewer" id="viewer">
    <div class="paper-scaler" id="scaler">
      <div class="paper" id="paper"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
